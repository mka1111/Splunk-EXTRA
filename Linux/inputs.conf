###############################################################################
# org_linux_inputs - inputs.conf
# $SPLUNK_HOME/etc/apps/org_linux_inputs/local/inputs.conf
#
###############################################################################

[default]
host = $decideOnStartup
index = hbk_prod_linux


###############################################################################
# SYSLOG
###############################################################################

[monitor:///var/log/syslog]
sourcetype = syslog
disabled = false

[monitor:///var/log/messages]
sourcetype = syslog
disabled = false


###############################################################################
# AUTHENTICATION
###############################################################################

[monitor:///var/log/auth.log]
sourcetype = linux_secure
index = hbk_prod_linux
disabled = false

[monitor:///var/log/secure]
sourcetype = linux_secure
index = hbk_prod_linux
disabled = false


###############################################################################
# PRIVILEGE ESCALATION
###############################################################################

[monitor:///var/log/sudo.log]
sourcetype = linux_secure
index = hbk_prod_linux
disabled = false




###############################################################################
# SCHEDULED TASKS - persistence
###############################################################################

# RHEL-family only; on Ubuntu cron logs land in /var/log/syslog
[monitor:///var/log/cron]
sourcetype = linux_cron
index = hbk_prod_linux
disabled = false


[monitor:///var/spool/cron]
sourcetype = crontab
index = hbk_prod_linux
crcSalt = <SOURCE>
alwaysOpenFile = 1
blacklist = (\.tmp$|^\.)
disabled = false


###############################################################################
# AUDITD
#
# /var/log/audit is mode 0700 root-only. A non-root forwarder cannot read it.
# Either run splunkd as root, grant an ACL, or relay via audisp to syslog.
###############################################################################


[monitor:///var/log/audit/audit.log]
disabled = false
index = hbk_prod_linux
sourcetype = linux_audit
ignoreOlderThan = 7d



###############################################################################
# BASH HISTORY
#
# Rewritten wholesale on shell exit rather than appended, so tailing is
# unreliable and duplicates are expected. Treat as supplementary, not
# authoritative - auditd execve is the real command-execution source.
###############################################################################

[monitor:///home/*/.bash_history]
sourcetype = bash_history
index = hbk_prod_linux
crcSalt = <SOURCE>
alwaysOpenFile = 1
disabled = false

[monitor:///root/.bash_history]
sourcetype = bash_history
index = hbk_prod_linux
crcSalt = <SOURCE>
alwaysOpenFile = 1
disabled = false



###############################################################################
# SCRIPTED INPUTS
###############################################################################

[script://./bin/lastlog.sh]
sourcetype = lastlog
index = hbk_prod_linux
interval = 3600
disabled = false
